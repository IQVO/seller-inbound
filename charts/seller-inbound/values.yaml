# Default values for seller-inbound. Three components: the api Deployment
# (cmd/api, always), the optional, default-off mcp Deployment (cmd/mcp,
# ADR 0006 — the read-only MCP server) and the optional, default-off frontend
# Deployment (the seller_inbound_mfe web remote, ADR 0007). The outbox relay,
# the three Kafka consumers and the three loops run inside the api only; there
# is no projector or reports component.

replicaCount: 1

image:
  repository: ghcr.io/iqvo/seller-inbound
  pullPolicy: IfNotPresent
  # Empty = the chart's appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as uid/gid 1000 (Dockerfile) and writes nothing to disk.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: seller-inbound.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Disabled-by-default alternative to ingress. Routes only to the api Service.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler for the api Deployment, off by default. When on, the
# Deployment omits replicas. More than one replica is safe for the outbox relay
# (FOR UPDATE SKIP LOCKED), the version-guarded writes and the consumers (stable
# groups, inbox on the CloudEvents id); it has not been load-tested.
autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# Environment read by cmd/api/main.go. Every key maps 1:1 to one env var and is
# rendered both into the ConfigMap (envFrom) and into the container env.
config:
  httpAddr: ":8080"                  # HTTP_ADDR
  logLevel: "info"                   # LOG_LEVEL: debug | info | warn (or warning) | error
  # EVENT_PUBLISHER: "kafka" is the only publisher; anything else is refused at
  # render and by the binary at boot.
  eventPublisher: "kafka"
  # OUTBOX_RELAY_INTERVAL: Go duration or plain seconds. Empty = not rendered
  # (binary default 1s).
  outboxRelayInterval: ""
  # OUTBOX_MAX_ATTEMPTS: failures before the relay excludes an outbox row;
  # 0 = unlimited.
  outboxMaxAttempts: 20
  # SHUTDOWN_DRAIN_DELAY: wait after /readyz flips before closing the listener.
  # Empty = not rendered (binary default 5s). Whole seconds only ("5s", "0")
  # so the chart can check terminationGracePeriodSeconds against it.
  shutdownDrainDelay: ""

  # STABLE consumer group ids, service-prefixed, never the pod name: a
  # rescheduled pod must resume from its committed offsets. All REQUIRED (empty
  # = the chart refuses to render, the binary refuses to boot).
  nodeConsumerGroup: ""              # NODE_CONSUMER_GROUP (node-topology events)
  catalogConsumerGroup: ""           # CATALOG_CONSUMER_GROUP (offer-availability packaging events)
  receiptConsumerGroup: ""           # RECEIPT_CONSUMER_GROUP (vendor-connectivity receipt events)

  # The network's own GS1 company prefix (6 to 11 digits) the SSCCs it issues are
  # built from. REQUIRED, no default.
  ssccCompanyPrefix: ""              # SSCC_COMPANY_PREFIX
  # Extension digit 0..9 of issued SSCCs. Empty = not rendered (binary default 0).
  ssccExtensionDigit: ""             # SSCC_EXTENSION_DIGIT

# The chart refuses to render unless database.url or database.existingSecret is
# set: the service runs on real Postgres only.
database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same secret, of a DIRECT (non-pooled, session-mode) connection
  # string used ONLY for the boot migrations (golang-migrate takes a session
  # advisory lock a transaction-pooling proxy cannot honour). Rendered with
  # `optional: true`: a secret without this key still starts the pod and the
  # binary falls back to DATABASE_URL.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

# KAFKA_BROKERS is MANDATORY (comma-separated host:port): relay, consumers and
# /readyz all dial Kafka. Produced topic: retailnetwork.seller-inbound.events
# (six analytics-only events on .analytics). The chart refuses to render
# without the brokers.
kafka:
  brokers: ""

# Extra env vars appended to the api container as a raw list. The chart refuses
# EVENT_PUBLISHER other than "kafka" and any *_MODE variable here: the service
# has no mode switches.
extraEnv: []

# The Postgres dial at boot is wrapped in a bounded retry (15 s of backoff);
# periodSeconds * failureThreshold gives a ~60 s window before the kubelet gives
# up. Once startupProbe succeeds, liveness takes over; readiness uses /readyz
# (flipped to not-ready as the FIRST step of graceful shutdown).
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Room for the binary's sequential graceful shutdown (cmd/api/main.go):
# SHUTDOWN_DRAIN_DELAY (5 s) + HTTP drain (10 s) + consumers and loops (10 s) +
# relay (10 s) = 35 s. The chart refuses anything under 40 and anything not
# above the drain delay + 30 s: a shorter grace period SIGKILLs the consumers
# or the relay mid-drain.
terminationGracePeriodSeconds: 40

nodeSelector: {}
tolerations: []
affinity: {}

# The read-only MCP server (ADR 0006): cmd/mcp serving the four read tools
# over Streamable HTTP. It needs the database ONLY (no Kafka: it never dials
# it) and is OFF by default.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"                  # MCP_ADDR
  serviceVersion: "dev"              # SERVICE_VERSION (logged at boot)
  environment: "dev"                 # ENVIRONMENT (logged at boot)
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Gateway exposure: /api/mcp/seller-inbound -> Service :8090, prefix
  # rewritten to /mcp. Needs the Gateway parentRef from the environment that
  # deploys the chart. No auth plugin anywhere (fleet-wide revert).
  route:
    enabled: false
    path: "/api/mcp/seller-inbound"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# The console web remote (ADR 0007): the seller_inbound_mfe Module Federation
# remote (web/), a static nginx pod serving the SPA the warehouse-console
# shell mounts under /seller-inbound/*. OFF by default: the api alone is the
# default runtime. It needs no database and no Kafka, and this chart never
# routes it -- the web gateway owns the public /mfes/seller-inbound/ path.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/iqvo/seller-inbound-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
