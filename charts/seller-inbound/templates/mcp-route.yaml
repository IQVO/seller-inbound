{{- if and .Values.mcp.enabled .Values.mcp.route.enabled -}}
{{- /*
MCP exposure through the gateway (fleet decision: gateway config lives in the
application charts, not in the infrastructure repo).

Host contract: /api/mcp/<context> -> Service <context>-mcp:8090, prefix
rewritten to /mcp (the SDK's canonical endpoint on cmd/mcp; /healthz
deliberately stays off the host -- it is a Kubernetes probe concern, not a
public endpoint). No auth anywhere on the route (fleet-wide revert
2026-09-11): access control is the in-cluster boundary.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "seller-inbound.mcpFullname" . }}
  labels:
    {{- include "seller-inbound.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  parentRefs:
    {{- range .Values.mcp.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.mcp.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp
      backendRefs:
        - name: {{ include "seller-inbound.mcpFullname" . }}
          port: {{ .Values.mcp.service.port }}
{{- end }}
