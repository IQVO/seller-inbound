{{- if .Values.a2a.enabled }}
{{- include "seller-inbound.requireDatabase" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "seller-inbound.a2aFullname" . }}
  labels:
    {{- include "seller-inbound.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  replicas: {{ .Values.a2a.replicaCount }}
  selector:
    matchLabels:
      {{- include "seller-inbound.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: a2a
  template:
    metadata:
      labels:
        {{- include "seller-inbound.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: a2a
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "seller-inbound.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: a2a
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "seller-inbound.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/a2a"]
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.targetPort }}
              protocol: TCP
          # Env contract verified against cmd/a2a (main.go, telemetry.go): A2A_ADDR,
          # A2A_AGENT_URL, LOG_LEVEL, SERVICE_VERSION, ENVIRONMENT,
          # OTEL_SERVICE_NAME, OTEL_EXPORTER_OTLP_ENDPOINT, DATABASE_URL and
          # (migration step only) MIGRATIONS_DATABASE_URL — exactly the
          # variables that binary reads, and nothing else. cmd/a2a has no auth
          # env, starts no outbox relay, runs no consumer and never dials Kafka
          # (no KAFKA_BROKERS, no EVENT_PUBLISHER, no consumer groups here);
          # the api ConfigMap is deliberately NOT mounted, so no
          # Kafka/relay/group variable can leak into it. A2A_AGENT_URL is the
          # absolute URL the Agent Card advertises (mandatory: the binary
          # refuses to boot without it); it defaults to this release's
          # in-cluster Service DNS name and is overridden by a2a.agentUrl.
          env:
            - name: A2A_ADDR
              value: {{ .Values.a2a.httpAddr | quote }}
            - name: A2A_AGENT_URL
              value: {{ .Values.a2a.agentUrl | default (printf "http://%s.%s.svc.cluster.local:%v/" (include "seller-inbound.a2aFullname" .) .Release.Namespace .Values.a2a.service.port) | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.a2a.serviceVersion | default .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.a2a.environment | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-a2a" .Values.otel.serviceName | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "seller-inbound.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # cmd/a2a runs the idempotent embedded migrations on start (like
            # the api), so it needs the same direct-connection key.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "seller-inbound.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- range .Values.a2a.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          # GET /healthz is served by cmd/a2a, so every probe has a cheap
          # target (the binary exposes no /readyz: it has no drain gate).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.a2a.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
