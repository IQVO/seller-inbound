      - type: object
        properties:
          data:
            type: object
            required:
            - planId
            - sellerId
            - destinationNodeId
            - packingOption
            - lines
            - confirmedAt
            properties:
              planId:
                type: string
              sellerId:
                type: string
              destinationNodeId:
                type: string
              packingOption:
                type: string
                enum:
                - INDIVIDUAL
                - CASE_PACKED
              lines:
                type: array
                items:
                  $ref: '#/components/schemas/PlanLine'
              confirmedAt:
                type: string
                format: date-time
    InboundShipmentLabelledEvent:
      allOf:
