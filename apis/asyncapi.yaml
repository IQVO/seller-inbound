  schemas:
    CloudEventEnvelope:
      type: object
      required:
      - specversion
      - id
      - source
      - type
      - subject
      - time
      - datacontenttype
      - dataschema
      - data
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
        source:
          type: string
        type:
          type: string
        subject:
          type: string
          description: The aggregate root id (sellerId, planId, shipmentId or the producer's own root id).
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        dataschema:
          type: string
    PackLevel:
      type: string
      enum:
      - EACH
      - INNER
      - CASE
      - PALLET
      description: Packaging level, lowest first.
    CartonReceiptStatus:
      type: string
      enum:
      - RECEIVED
      - MISSING
      - UNEXPECTED
      - DAMAGED
    PlanLine:
      type: object
      required:
      - catalogItemId
      - gtin
      - qtyEaches
      properties:
        catalogItemId:
          type: string
        gtin:
          type: string
          pattern: ^[0-9]{14}$
        qtyEaches:
          type: integer
          minimum: 1
    CartonContent:
      type: object
      required:
      - catalogItemId
      - gtin
      - qtyEaches
      properties:
        catalogItemId:
          type: string
        gtin:
          type: string
          pattern: ^[0-9]{14}$
        qtyEaches:
          type: integer
          minimum: 1
        lot:
          type: string
          maxLength: 20
        expiry:
          type: string
          format: date
    Carton:
      type: object
      required:
      - sscc
      - kind
      - contents
      - grossWeightG
      - dimsMm
      properties:
        sscc:
          type: string
          pattern: ^[0-9]{18}$
        parentSscc:
          type: string
          pattern: ^[0-9]{18}$
        kind:
          type: string
          enum:
          - HOMOGENEOUS_CASE
          - MIXED
        contents:
          type: array
          items:
            $ref: '#/components/schemas/CartonContent'
        grossWeightG:
          type: integer
          minimum: 1
        dimsMm:
          type: object
          required:
          - l
          - w
          - h
          properties:
            l:
              type: integer
            w:
              type: integer
            h:
              type: integer
    InboundLimits:
      type: object
      description: Optional inbound limits of the node; every field is optional.
      properties:
        maxCartonWeightG:
          type: integer
        maxCartonDimsMm:
          type: object
          required:
          - l
          - w
          - h
          properties:
            l:
              type: integer
            w:
              type: integer
            h:
              type: integer
        acceptsPallets:
          type: boolean
        requiresSscc:
          type: boolean
    SellerOnboardedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - sellerId
            - name
            - onboardedAt
            properties:
              sellerId:
                type: string
              name:
                type: string
              onboardedAt:
                type: string
                format: date-time
    SellerSuspendedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - sellerId
            - suspendedAt
            properties:
              sellerId:
                type: string
              suspendedAt:
                type: string
                format: date-time
                description: When the seller was suspended, RFC 3339 UTC.
              reason:
                type: string
                description: Optional; omitted when empty.
    SellerReinstatedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - sellerId
            - reinstatedAt
            properties:
              sellerId:
                type: string
              reinstatedAt:
                type: string
                format: date-time
                description: When the seller was reinstated, RFC 3339 UTC.
    PlacementPlanSuggestedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - planId
            - sellerId
            - catalogItemId
            - basis
            - suggestions
            - createdAt
            properties:
              planId:
                type: string
              sellerId:
                type: string
              catalogItemId:
                type: string
              basis:
                type: string
                description: The formula version the suggestions were computed under (ADR 0012).
              suggestions:
                type: array
                description: Legal and possibly empty; the advisory never suggests zero units.
                items:
                  $ref: '#/components/schemas/PlacementSuggestion'
              createdAt:
                type: string
                format: date-time
    PlacementSuggestion:
      type: object
      required:
      - nodeId
      - regionId
      - suggestedUnits
      - regionDemandUnits
      - nodeAvailabilityUnits
      properties:
        nodeId:
          type: string
        regionId:
          type: string
        suggestedUnits:
          type: integer
        regionDemandUnits:
          type: integer
          description: The units the region released in the 28-day observation window (the evidence).
        nodeAvailabilityUnits:
          type: integer
          description: The units the node's listing declared available (the evidence).
    ListingAvailabilityChangedIn:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - listingId
            - catalogItemId
            - nodeId
            - availableQty
            - asOf
            properties:
              listingId:
                type: string
              catalogItemId:
                type: string
              nodeId:
                type: string
              availableQty:
                type: integer
              basis:
                type: string
              asOf:
                type: string
                format: date-time
    FulfillmentReleasedToNodeIn:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - assignmentId
            - groupNo
            - nodeId
            - lines
            properties:
              assignmentId:
                type: string
              releaseNo:
                type: integer
              orderId:
                type: string
              groupNo:
                type: integer
              nodeId:
                type: string
              lines:
                type: array
                items:
                  type: object
                  required:
                  - catalogItemId
                  - quantity
                  properties:
                    catalogItemId:
                      type: string
                    listingId:
                      type: string
                    quantity:
                      type: integer
    FulfillmentCancelledIn:
      allOf:
