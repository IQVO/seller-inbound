  schemas:
    CloudEventEnvelope:
      type: object
      required:
      - specversion
      - id
      - source
      - type
      - subject
      - time
      - datacontenttype
      - dataschema
      - data
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
        source:
          type: string
        type:
          type: string
        subject:
          type: string
          description: The aggregate root id (sellerId, planId, shipmentId or the producer's own root id).
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        dataschema:
          type: string
    PackLevel:
      type: string
      enum:
      - EACH
      - INNER
      - CASE
      - PALLET
      description: Packaging level, lowest first.
    CartonReceiptStatus:
      type: string
      enum:
      - RECEIVED
      - MISSING
      - UNEXPECTED
      - DAMAGED
    PlanLine:
      type: object
      required:
      - catalogItemId
      - gtin
      - qtyEaches
      properties:
        catalogItemId:
          type: string
        gtin:
          type: string
          pattern: ^[0-9]{14}$
        qtyEaches:
          type: integer
          minimum: 1
    CartonContent:
      type: object
      required:
      - catalogItemId
      - gtin
      - qtyEaches
      properties:
        catalogItemId:
          type: string
        gtin:
          type: string
          pattern: ^[0-9]{14}$
        qtyEaches:
          type: integer
          minimum: 1
        lot:
          type: string
          maxLength: 20
        expiry:
          type: string
          format: date
    Carton:
      type: object
      required:
      - sscc
      - kind
      - contents
      - grossWeightG
      - dimsMm
      properties:
        sscc:
          type: string
          pattern: ^[0-9]{18}$
        parentSscc:
          type: string
          pattern: ^[0-9]{18}$
        kind:
          type: string
          enum:
          - HOMOGENEOUS_CASE
          - MIXED
        contents:
          type: array
          items:
            $ref: '#/components/schemas/CartonContent'
        grossWeightG:
          type: integer
          minimum: 1
        dimsMm:
          type: object
          required:
          - l
          - w
          - h
          properties:
            l:
              type: integer
            w:
              type: integer
            h:
              type: integer
    InboundLimits:
      type: object
      description: Optional inbound limits of the node; every field is optional.
      properties:
        maxCartonWeightG:
          type: integer
        maxCartonDimsMm:
          type: object
          required:
          - l
          - w
          - h
          properties:
            l:
              type: integer
            w:
              type: integer
            h:
              type: integer
        acceptsPallets:
          type: boolean
        requiresSscc:
          type: boolean
    SellerOnboardedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - sellerId
            - name
            - onboardedAt
            properties:
              sellerId:
                type: string
              name:
                type: string
              onboardedAt:
                type: string
                format: date-time
    SellerSuspendedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - sellerId
            - suspendedAt
            properties:
              sellerId:
                type: string
              suspendedAt:
                type: string
                format: date-time
              reason:
                type: string
                description: Optional; omitted when empty.
    SellerReinstatedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
